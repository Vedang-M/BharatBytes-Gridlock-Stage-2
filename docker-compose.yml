version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./jan to may police violation_anonymized791b166.csv:/app/data/violations.csv
      - ./model/saved_models:/app/models
    environment:
      - CSV_PATH=/app/data/violations.csv
      - MODEL_DIR=/app/models
      - PORT=8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  model-api:
    build:
      context: ./model
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./model/saved_models:/app/saved_models
    command: python api/model_api.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
